<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
</head>
<body>

    <h1>Student Management System</h1>

    <hr>

    <h2>Student Registration</h2>

    <form id="registrationForm">
        <label>Student Name:</label>
        <input type="text" id="name" required>
        <br><br>

        <label>Student ID:</label>
        <input type="text" id="studentId" required>
        <br><br>

        <label>Email:</label>
        <input type="email" id="email" required>
        <br><br>

        <button type="submit">Register Student</button>
    </form>

    <p id="registrationMessage"></p>

    <hr>

    <h2>Student Results</h2>

    <label>Student Name:</label>
    <input type="text" id="resultName">
    <br><br>

    <label>Marks (out of 100):</label>
    <input type="number" id="marks" min="0" max="100">
    <br><br>

    <button type="button" onclick="checkResult()">Check Result</button>

    <p id="resultMessage"></p>

    <script>
        document.getElementById("registrationForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                document.getElementById("registrationMessage").textContent =
                    "Student registered successfully!";
            });

        function checkResult() {
            let name = document.getElementById("resultName").value.trim();
            let marks = document.getElementById("marks").value;
            let message = document.getElementById("resultMessage");

            if (name === "" || marks === "") {
                message.textContent = "Please enter all details.";
                return;
            }

            let score = Number(marks);

            if (score < 0 || score > 100) {
                message.textContent = "Marks must be between 0 and 100.";
            } else if (score >= 40) {
                message.textContent = name + " has PASSED!";
            } else {
                message.textContent = name + " has FAILED!";
            }
        }
    </script>

</body>
</html>
